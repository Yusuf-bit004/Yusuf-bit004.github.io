<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF Scanner</title>

<style>
:root{--b:#2f7bff;--bg:#050b1e;--c:#0e1a3a;--t:#eef3ff;--m:#8fa3d6;--ln:#2f5bd655}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.4 "Segoe UI",Roboto,system-ui,sans-serif;color:var(--t);padding-bottom:160px;background:radial-gradient(circle at 85% 0,#0b3bb5 0,transparent 42%),radial-gradient(circle at 0 45%,#0a2a7a 0,transparent 38%),var(--bg);background-attachment:fixed}
header{display:flex;align-items:center;gap:10px;padding:14px 16px;font-weight:800;font-size:20px;letter-spacing:.3px;background:linear-gradient(135deg,#0b1f4d,#1a5fd8);box-shadow:0 4px 24px #0b3bb577}
header b{background:#e53935;padding:2px 9px;border-radius:8px;font-size:17px}
main{padding:12px;max-width:640px;margin:auto}
h3{margin:4px 2px 10px;font-size:13px;letter-spacing:.8px;text-transform:uppercase;color:var(--m);font-weight:700}
.card{background:linear-gradient(160deg,#101f4a,#0b1636);border:1px solid var(--ln);border-radius:20px;padding:14px;margin-bottom:14px;box-shadow:0 0 28px #1a4dff1f}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
button,.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-size:15px;font-weight:600;color:#fff;background:linear-gradient(135deg,#1e6bff,#4aa3ff);border:0;border-radius:14px;padding:11px 16px;margin:3px 3px 3px 0;box-shadow:0 4px 16px #1a6bff55}
button.s{background:#ffffff0d;border:1px solid #4a7dff88;color:#a9c8ff;box-shadow:none}
button.d{background:linear-gradient(135deg,#e53935,#ff6f60);box-shadow:0 4px 14px #e5393555}
.ib{width:38px;height:38px;padding:0;margin:0;border-radius:12px}
input,textarea,select{width:100%;padding:12px;border-radius:12px;border:1px solid #2f5bd677;background:#0a1534;color:var(--t);font:inherit;font-size:15px;margin:4px 0}
.srch{position:relative}.srch .ic{position:absolute;left:12px;top:14px;color:var(--m)}.srch input{padding-left:42px;margin:0 0 12px}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qa .btn,.qa button{flex-direction:column;gap:6px;margin:0;padding:14px 4px;font-size:13px;line-height:1.2;text-align:center;min-width:0;background:linear-gradient(160deg,#16296a,#0b1840);border:1px solid #3b63d0aa;border-radius:20px;box-shadow:0 0 20px #2a6bff44}
.qa .ic{width:30px;height:30px;color:#6db0ff;filter:drop-shadow(0 0 6px #2f7bff)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.chips button{margin:0;padding:8px 14px;border-radius:999px;font-size:14px;white-space:nowrap;flex:none}
.row{display:flex;gap:8px;flex-wrap:wrap}
.dc{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #2f5bd633}.dc:last-child{border:0}
.dc img{width:64px;height:84px;object-fit:cover;border-radius:10px;background:#ffffff14;border:1px solid var(--ln);flex:none}
.dc .in{flex:1;min-width:0}.dc b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dc small{color:var(--m)}
.ac{display:flex;gap:6px;margin-top:8px}
.ck{width:20px!important;height:20px;margin:0!important;accent-color:#2f7bff;flex:none}
.em{text-align:center;color:var(--m);padding:24px 8px}.em .ic{width:48px;height:48px;color:#3b63d0;display:block;margin:0 auto 8px}
.tl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tl button{flex-direction:column;gap:4px;margin:0;font-size:13px;padding:12px 4px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#08122cee;backdrop-filter:blur(12px);border-top:1px solid var(--ln);z-index:4}
nav button{flex:1;flex-direction:column;gap:2px;font-size:12px;background:none;box-shadow:none;color:var(--m);border-radius:0;margin:0;padding:9px 0 11px}
nav button.on{color:#6db0ff}nav button.on .ic{filter:drop-shadow(0 0 6px #2f7bff)}
#fab{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#5aa2ff,#0b3bb5);box-shadow:0 0 0 4px #08122c,0 0 30px #2f7bff;display:flex;align-items:center;justify-content:center;z-index:5;color:#fff}
#fab .ic{width:32px;height:32px}
.hid{display:none!important}
#ed{position:fixed;inset:0;background:#050b1e;display:none;flex-direction:column;z-index:9}
.eh{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-weight:700;background:#08122c;border-bottom:1px solid var(--ln)}.eh button{margin:0}
#cv{flex:1;min-height:0;width:100%;touch-action:none;background:#02060f}
#ed .chips{padding:10px 12px 0;margin:0}
.et{display:flex;gap:6px;padding:8px 10px 14px;overflow-x:auto}.et button{flex:1;flex-direction:column;font-size:12px;gap:3px;padding:8px 6px;margin:0;white-space:nowrap}
.bar{display:flex;gap:6px;padding:10px;background:#08122c;align-items:center}
#sp{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:10}
#sp div{background:var(--c);padding:12px;border-radius:14px}
#sc{background:#fff;border:1px solid #888;touch-action:none;display:block;border-radius:10px}
#tt{position:fixed;left:12px;right:12px;bottom:90px;background:#000d;color:#fff;padding:10px;border-radius:10px;display:none;z-index:12;text-align:center}
#qr{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:11}
#qv{flex:1;min-height:0;width:100%;object-fit:cover}
</style></head><body>

<div id="v0">
 <div class="card"><div class="srch"><svg class="ic"><use href="#i-search"/></svg><input id="q" placeholder="Поиск документов" oninput="lib0()"></div>
 <div class="qa">
